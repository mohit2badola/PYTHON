<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - TaskFlow Pro</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .admin-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .admin-header {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        color: white;
    }

    .stat-card h3 {
        font-size: 14px;
        color: rgba(255,255,255,0.9);
        margin-bottom: 10px;
    }

    .stat-card .number {
        font-size: 36px;
        font-weight: bold;
        color: white;
    }

    .section {
        background: white;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .section h2 {
        margin-bottom: 20px;
        color: #1e293b;
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
        font-weight: 600;
    }

    /* Table Styles - FIXED (Darker and more visible) */
    .users-table, .tasks-table {
        width: 100%;
        overflow-x: auto;
        background: white;
        border-radius: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th {
        background: #1e293b;
        color: white;
        padding: 12px;
        text-align: left;
        font-weight: 600;
        border-bottom: 2px solid #667eea;
    }

    td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
        background: white;
        color: #1e293b;
    }

    tr:hover td {
        background: #f1f5f9;
    }

    .delete-btn {
        background: #ef4444;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        margin: 0 3px;
        transition: all 0.2s;
    }

    .delete-btn:hover {
        background: #dc2626;
        transform: scale(1.02);
    }

    .view-btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        margin: 0 3px;
        transition: all 0.2s;
    }

    .view-btn:hover {
        background: #2563eb;
        transform: scale(1.02);
    }

    .back-btn {
        background: #64748b;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin: 0 5px;
        transition: all 0.2s;
    }

    .back-btn:hover {
        background: #475569;
    }

    /* Status Badge */
    .status {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
    }

    .status.completed {
        background: #10b981;
        color: white;
    }

    .status.todo {
        background: #f59e0b;
        color: white;
    }

    /* Modal Styles */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background: white;
        border-radius: 15px;
        width: 80%;
        max-width: 800px;
        max-height: 80%;
        overflow-y: auto;
    }

    .modal-header {
        padding: 20px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e293b;
        color: white;
        border-radius: 15px 15px 0 0;
    }

    .modal-header h2 {
        color: white;
    }

    .modal-header span {
        color: white;
        font-size: 28px;
        cursor: pointer;
    }

    .modal-body {
        padding: 20px;
    }

    /* Activity Log Styles */
    #recentActivity {
        max-height: 400px;
        overflow-y: auto;
    }

    .activity-item {
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
        margin-bottom: 5px;
        border-radius: 8px;
    }

    .activity-item:hover {
        background: #f1f5f9;
    }
</style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
        <div>
            <button onclick="window.location.href='/'" class="back-btn">← Back to Dashboard</button>
            <button onclick="window.location.href='/logout'" class="delete-btn">Logout</button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="admin-stats" id="adminStats">
        <div class="stat-card">
            <h3>Total Users</h3>
            <div class="number" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Tasks</h3>
            <div class="number" id="totalTasks">0</div>
        </div>
        <div class="stat-card">
            <h3>Completed Tasks</h3>
            <div class="number" id="completedTasks">0</div>
        </div>
        <div class="stat-card">
            <h3>Completion Rate</h3>
            <div class="number" id="completionRate">0%</div>
        </div>
    </div>

    <!-- Users Section -->
    <div class="section">
        <h2><i class="fas fa-users"></i> All Users</h2>
        <div class="users-table">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Tasks</th>
                        <th>Completed</th>
                        <th>Joined</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
    </div>

    <!-- All Tasks Section -->
    <div class="section">
        <h2><i class="fas fa-tasks"></i> All Tasks (Recent 100)</h2>
        <div class="tasks-table">
            <table id="allTasksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>User</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="allTasksBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Recent Activity Section -->
    <div class="section">
        <h2><i class="fas fa-history"></i> Recent Activity (All Users)</h2>
        <div id="recentActivity"></div>
    </div>
</div>

<!-- User Details Modal -->
<div class="modal" id="userModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>User Details</h2>
            <span onclick="closeUserModal()" style="cursor: pointer; font-size: 24px;">&times;</span>
        </div>
        <div class="modal-body" id="userModalBody"></div>
    </div>
</div>

<script>
// Add to admin.html script section
function showAdminLoading() {
    document.getElementById('usersBody').innerHTML = `
        <tr><td colspan="7" style="text-align: center;">
            <div class="spinner" style="margin: 20px auto;"></div>
            Loading users...
        </td></tr>
    `;
}

async function loadUsers() {
    showAdminLoading();
    let res = await fetch("/admin/users", { credentials: 'same-origin' });
    let users = await res.json();
    // ... rest of code
}
// Load all admin data
async function loadAdminData() {
    await loadStats();
    await loadUsers();
    await loadAllTasks();
}

// Load statistics
async function loadStats() {
    let res = await fetch("/admin/stats", { credentials: 'same-origin' });
    let stats = await res.json();

    document.getElementById("totalUsers").innerText = stats.total_users || 0;
    document.getElementById("totalTasks").innerText = stats.total_tasks || 0;
    document.getElementById("completedTasks").innerText = stats.completed_tasks || 0;
    document.getElementById("completionRate").innerText = (stats.completion_rate || 0) + "%";

    // Display recent activity
    let activityHtml = '<div style="max-height: 300px; overflow-y: auto;">';
    stats.recent_activity.forEach(activity => {
        activityHtml += `
            <div style="padding: 10px; border-bottom: 1px solid #e2e8f0;">
                <strong>${escapeHtml(activity.username)}</strong>:
                ${escapeHtml(activity.action)} - ${escapeHtml(activity.details || '')}
                <br><small style="color: #666;">${new Date(activity.timestamp).toLocaleString()}</small>
            </div>
        `;
    });
    activityHtml += '</div>';
    document.getElementById("recentActivity").innerHTML = activityHtml;
}

// Load all users
async function loadUsers() {
    let res = await fetch("/admin/users", { credentials: 'same-origin' });
    let users = await res.json();

    let tbody = document.getElementById("usersBody");
    tbody.innerHTML = "";

    users.forEach(user => {
        tbody.innerHTML += `
            <tr>
                <td>${user.id}</td>
                <td>${escapeHtml(user.username)}</td>
                <td>${user.total_tasks || 0}</td>
                <td>${user.completed_tasks || 0}</td>
                <td>${new Date(user.created_at).toLocaleDateString()}</td>
                <td>${user.is_admin ? '✅ Yes' : '❌ No'}</td>
                <td>
                    <button class="view-btn" onclick="viewUser(${user.id})">View</button>
                    ${!user.is_admin ? `<button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>` : ''}
                </td>
            </tr>
        `;
    });
}

// Load all tasks
async function loadAllTasks() {
    let res = await fetch("/admin/all-tasks", { credentials: 'same-origin' });
    let tasks = await res.json();

    let tbody = document.getElementById("allTasksBody");
    tbody.innerHTML = "";

    tasks.forEach(task => {
        let priorityEmoji = {
            'High': '🔴',
            'Medium': '🟡',
            'Low': '🟢'
        }[task.priority] || '⚪';

        tbody.innerHTML += `
            <tr>
                <td>${task.id}</td>
                <td>${escapeHtml(task.title)}</td>
                <td>${escapeHtml(task.owner_name)}</td>
                <td><span class="status ${task.status === 'Completed' ? 'completed' : 'todo'}">${task.status}</span></td>
                <td>${priorityEmoji} ${task.priority || 'Medium'}</td>
                <td>${new Date(task.created_at).toLocaleString()}</td>
            </tr>
        `;
    });
}

// View user details
async function viewUser(userId) {
    let res = await fetch(`/admin/user/${userId}`, { credentials: 'same-origin' });
    let data = await res.json();

    let modalBody = document.getElementById("userModalBody");
    modalBody.innerHTML = `
        <h3>User: ${escapeHtml(data.user.username)}</h3>
        <p><strong>Joined:</strong> ${new Date(data.user.created_at).toLocaleString()}</p>
        <p><strong>Admin:</strong> ${data.user.is_admin ? 'Yes' : 'No'}</p>

        <h4>Tasks (${data.tasks.length})</h4>
        <div style="max-height: 300px; overflow-y: auto;">
            <table style="width: 100%;">
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.tasks.map(task => `
                        <tr>
                            <td>${escapeHtml(task.title)}</td>
                            <td>${task.status}</td>
                            <td>${task.priority || 'Medium'}</td>
                            <td>${task.due_date || 'No due date'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>

        <h4>Recent Activity</h4>
        <div style="max-height: 200px; overflow-y: auto;">
            ${data.activities.map(activity => `
                <div style="padding: 8px; border-bottom: 1px solid #e2e8f0;">
                    <strong>${activity.action}</strong><br>
                    ${escapeHtml(activity.details || '')}<br>
                    <small>${new Date(activity.timestamp).toLocaleString()}</small>
                </div>
            `).join('')}
        </div>
    `;

    document.getElementById("userModal").style.display = "flex";
}

// Delete user
async function deleteUser(userId) {
    if(confirm("Are you sure you want to delete this user and all their tasks?")) {
        let res = await fetch(`/admin/delete-user/${userId}`, {
            method: "DELETE",
            credentials: 'same-origin'
        });

        if (res.ok) {
            alert("User deleted successfully");
            loadAdminData();
        } else {
            let error = await res.json();
            alert("Error: " + error.error);
        }
    }
}

function closeUserModal() {
    document.getElementById("userModal").style.display = "none";
}

function escapeHtml(text) {
    if (!text) return '';
    let div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Load everything on page load
loadAdminData();
</script>
</body>
</html>
